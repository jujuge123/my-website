<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>奢驰美颜 · 运营后台 · ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Cinzel:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<!-- Login -->
<div class="admin-login" id="loginScreen">
  <div class="login-card">
    <div class="brand-mark">L · C</div>
    <h1>奢驰美颜 · 运营后台</h1>
    <p class="muted">LUXE CHI · ADMIN PANEL</p>
    <form id="loginForm">
      <label>
        <span>管理员密码</span>
        <input type="password" id="passInput" autofocus required />
      </label>
      <button type="submit" class="btn-gold full">登 录 <span>→</span></button>
      <p id="loginErr" class="login-err"></p>
    </form>
    <p class="muted small" style="margin-top:24px">
      默认密码: <strong style="color:var(--gold)">luxe2025</strong>（首次登录后请尽快修改）
    </p>
    <a href="index.html" class="back-site">← 返回前台</a>
  </div>
</div>

<!-- Admin -->
<div class="admin-shell" id="adminShell" style="display:none">
  <aside class="admin-side">
    <a href="index.html" class="side-brand">
      <span class="brand-mark">L · C</span>
      <span class="brand-text">
        <span class="brand-cn">奢驰美颜</span>
        <span class="brand-en">ADMIN PANEL</span>
      </span>
    </a>
    <nav class="side-nav">
      <button data-tab="dashboard" class="active">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>概览</span>
      </button>
      <button data-tab="products">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 5H3v14h18V5zm-2 12H5V7h14v10zM7 9h10v2H7zm0 4h7v2H7z"/></svg>
        <span>产品管理</span>
      </button>
      <button data-tab="orders">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 7h-3V5.5C16 4.1 14.9 3 13.5 3h-3C9.1 3 8 4.1 8 5.5V7H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 5.5c0-.3.2-.5.5-.5h3c.3 0 .5.2.5.5V7h-4V5.5z"/></svg>
        <span>订单管理</span>
        <span class="side-badge" id="orderCount">0</span>
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.5L17 7a8 8 0 0 0-1.7-1L15 3.5h-4L10.7 6c-.6.2-1.2.5-1.7 1L6.5 5.9l-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2L4.5 14.6l2 3.5L9 17a8 8 0 0 0 1.7 1L11 20.5h4l.3-2.5c.6-.2 1.2-.5 1.7-1l2.5 1L21.4 14 19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        <span>设置</span>
      </button>
    </nav>
    <div class="side-foot">
      <button id="logoutBtn" class="btn-line full">退出登录</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-head">
      <h2 id="pageTitle">概览</h2>
      <div class="admin-head-right">
        <a href="index.html" target="_blank" class="btn-line">查看前台 ↗</a>
      </div>
    </header>

    <!-- Dashboard -->
    <section class="tab-pane active" data-pane="dashboard">
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-num" id="kpiProducts">0</div><div class="kpi-lbl">在售产品</div></div>
        <div class="kpi"><div class="kpi-num" id="kpiOrders">0</div><div class="kpi-lbl">订单总数</div></div>
        <div class="kpi"><div class="kpi-num" id="kpiPending">0</div><div class="kpi-lbl">待处理订单</div></div>
        <div class="kpi"><div class="kpi-num" id="kpiRevenue">¥0</div><div class="kpi-lbl">总销售额</div></div>
      </div>
      <div class="dash-grid">
        <div class="dash-card">
          <h4>最新订单</h4>
          <div id="recentOrders" class="recent-list"></div>
        </div>
        <div class="dash-card">
          <h4>热销产品</h4>
          <div id="topProducts" class="top-list"></div>
        </div>
      </div>
    </section>

    <!-- Products -->
    <section class="tab-pane" data-pane="products">
      <div class="pane-toolbar">
        <input type="search" id="prodSearch" placeholder="搜索产品..." />
        <button class="btn-gold" id="addProdBtn">+ 添加产品</button>
      </div>
      <div class="data-table-wrap">
        <table class="data-table" id="productTable">
          <thead><tr>
            <th>图</th><th>产品名</th><th>分类</th><th>价格</th>
            <th>原价</th><th>库存</th><th>操作</th>
          </tr></thead>
          <tbody id="productTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Orders -->
    <section class="tab-pane" data-pane="orders">
      <div class="pane-toolbar">
        <input type="search" id="orderSearch" placeholder="按订单号 / 姓名 / 电话搜索..." />
        <select id="orderFilter">
          <option value="all">全部状态</option>
          <option value="pending">待支付</option>
          <option value="paid">已支付</option>
          <option value="shipped">已发货</option>
          <option value="completed">已完成</option>
          <option value="cancelled">已取消</option>
        </select>
      </div>
      <div class="data-table-wrap">
        <table class="data-table" id="orderTable">
          <thead><tr>
            <th>订单号</th><th>客户</th><th>金额</th><th>支付方式</th>
            <th>状态</th><th>下单时间</th><th>操作</th>
          </tr></thead>
          <tbody id="orderTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Settings -->
    <section class="tab-pane" data-pane="settings">
      <div class="settings-grid">
        <div class="set-card">
          <h4>联系方式</h4>
          <p class="muted small">这些信息会同步显示在前台联系区与订单成功页。</p>
          <form id="contactForm" class="set-form">
            <label><span>微信号</span><input name="wechatId" required /></label>
            <label><span>WhatsApp 号码</span><input name="whatsappNumber" /></label>
            <label><span>WhatsApp 链接</span><input name="whatsappLink" placeholder="https://wa.me/..." /></label>
            <label><span>LINE ID</span><input name="lineId" /></label>
            <label><span>LINE 链接</span><input name="lineLink" placeholder="https://line.me/ti/p/..." /></label>
            <button class="btn-gold" type="submit">保存</button>
          </form>
        </div>
        <div class="set-card">
          <h4>修改密码</h4>
          <p class="muted small">为安全起见请定期修改管理员密码。</p>
          <form id="passForm" class="set-form">
            <label><span>当前密码</span><input type="password" name="old" required /></label>
            <label><span>新密码</span><input type="password" name="new" required minlength="4" /></label>
            <label><span>确认新密码</span><input type="password" name="confirm" required minlength="4" /></label>
            <button class="btn-gold" type="submit">更新密码</button>
          </form>
        </div>
        <div class="set-card danger">
          <h4>数据维护</h4>
          <p class="muted small">谨慎操作。重置后无法恢复。</p>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
            <button class="btn-line" id="exportBtn">📥 导出全部数据 (JSON)</button>
            <button class="btn-line" id="importBtn">📤 导入数据 (JSON)</button>
            <input type="file" id="importFile" accept=".json" hidden />
            <button class="btn-line danger" id="resetProdBtn">⚠ 重置为默认产品</button>
            <button class="btn-line danger" id="clearOrdersBtn">⚠ 清空所有订单</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Product Edit Modal -->
<div class="modal" id="prodModal">
  <div class="modal-bg" onclick="closeProdModal()"></div>
  <div class="modal-card prod-edit-card">
    <button class="modal-close" onclick="closeProdModal()">×</button>
    <h3 id="prodModalTitle" style="font-family:var(--serif);font-size:26px;color:var(--cream);font-weight:500;padding:32px 32px 0">添加产品</h3>
    <form id="prodForm" class="prod-form">
      <input type="hidden" name="id" />
      <div class="form-row">
        <label><span>产品名（中文）</span><input name="name" required /></label>
        <label><span>产品名（英文）</span><input name="en" required /></label>
      </div>
      <div class="form-row">
        <label>
          <span>分类</span>
          <select name="cat" required>
            <option value="skincare">奢护精华</option>
            <option value="makeup">高定彩妆</option>
            <option value="device">美容仪器</option>
            <option value="set">尊享礼盒</option>
          </select>
        </label>
        <label><span>角标 (例: 限量/新品)</span><input name="tag" /></label>
      </div>
      <div class="form-row">
        <label><span>售价 (¥)</span><input name="price" type="number" min="0" step="1" required /></label>
        <label><span>原价 (¥)</span><input name="original" type="number" min="0" step="1" required /></label>
        <label><span>库存</span><input name="stock" type="number" min="0" step="1" value="100" /></label>
      </div>
      <label><span>主图 URL</span><input name="image" required /></label>
      <label><span>产品介绍</span><textarea name="desc" rows="3"></textarea></label>
      <label><span>卖点（每行一个）</span><textarea name="feats" rows="4" placeholder="阿尔巴黑松露萃取&#10;瑞士胜肽 SH-Polypeptide-9&#10;..."></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn-line" onclick="closeProdModal()">取消</button>
        <button type="submit" class="btn-gold">保存产品</button>
      </div>
    </form>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal" id="orderModal">
  <div class="modal-bg" onclick="closeOrderModal()"></div>
  <div class="modal-card order-detail-card">
    <button class="modal-close" onclick="closeOrderModal()">×</button>
    <div id="orderDetail"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="db.js"></script>
<script src="admin.js"></script>
</body>
</html>
